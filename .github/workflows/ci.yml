name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  CARGO_AUDIT_VERSION: "0.23.0"

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Install cargo-audit ${{ env.CARGO_AUDIT_VERSION }}
        run: cargo install --locked cargo-audit --version "${CARGO_AUDIT_VERSION}"

      - name: Run cargo audit
        run: cargo audit --deny unsound

  test:
    name: Test & Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dfcore is a sibling path dependency (../dfcore). Use the revision pinned in
      # flake.lock so cargo and nix build test against the same dfcore.
      - name: Checkout sibling dfcore at the locked revision
        run: |
          rev=$(jq -r '.nodes.dfcore.locked.rev' flake.lock)
          git clone https://github.com/tylerstyle/dfcore.git ../dfcore
          git -C ../dfcore checkout --detach "$rev"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy linter
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run unit and integration tests
        run: cargo test --locked --verbose

  nix:
    name: Nix Build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build package (runs the test suite in the Nix sandbox)
        run: nix build -L .#default
